name: Forward Issues to Tango

on:
  issues:
    types: [opened]

jobs:
  forward-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Forward issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TANGO_PUBLIC_ISSUE_FORWARDER_PAT }}
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || "";
            const url = context.payload.issue.html_url;

            await github.rest.issues.create({
              owner: "makegov",
              repo: "tango",
              title: `[PUBLIC] ${title}`,
              body: `Public issue: ${url}\n\n---\n\n${body}`
            });