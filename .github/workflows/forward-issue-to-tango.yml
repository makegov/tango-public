name: Sync Public Issues to Private Repo

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync issue or comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TANGO_PUBLIC_ISSUE_FORWARDER_PAT }}
          script: |
            const pub = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.payload.issue.number,
              url: context.payload.issue.html_url,
              title: context.payload.issue.title,
              body: context.payload.issue.body || "",
            };

            const event = context.eventName;
            const action = context.payload.action;
            const markerRegex = /Mirrored as private issue #(\d+)/;

            // Walk all public comments to find the already-linked private issue
            async function findPrivateIssueFromPublicComments() {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: pub.owner,
                  repo: pub.repo,
                  issue_number: pub.number,
                  per_page: 100,
                }
              );

              for (const comment of comments) {
                const match = comment.body.match(markerRegex);
                if (!match) continue;

                const n = Number(match[1]);
                if (!isNaN(n)) return n;
              }

              return null;
            }

            // Fallback: search the private repo for a mirrored URL in the body
            async function findPrivateIssueBySearch() {
              const search = await github.rest.search.issuesAndPullRequests({
                q: `repo:makegov/tango "${pub.url}" in:body is:issue`,
              });

              const hit = search.data.items?.[0];
              return hit ? hit.number : null;
            }

            // Utility: find or create the matching private issue
            async function getPrivateIssueNumber() {
              // Step 1: Look for a public comment linking to the private issue
              const fromComments = await findPrivateIssueFromPublicComments();
              if (fromComments) return fromComments;

              // Step 2: Fallback search in private repo (covers deleted markers)
              const fromSearch = await findPrivateIssueBySearch();
              if (fromSearch) return fromSearch;

              // Step 3: Not found → create new private issue
              const created = await github.rest.issues.create({
                owner: "makegov",
                repo: "tango",
                title: `[Public] ${pub.title}`,
                body: `Mirrored from: ${pub.url}\n\n${pub.body}`
              });

              // Step 4: Add a comment on the public issue establishing the link
              await github.rest.issues.createComment({
                owner: pub.owner,
                repo: pub.repo,
                issue_number: pub.number,
                body: `Mirrored as private issue #${created.data.number}`
              });

              return created.data.number;
            }

            // Prevent looping if someone somehow mirrors back into public
            if (pub.title.startsWith("[Public]")) {
              console.log("Skipping: private issue event triggered the workflow.");
              return;
            }

            const privateIssueNumber = await getPrivateIssueNumber();

            //
            // ISSUE UPDATES
            //
            if (event === "issues" && action === "edited") {
              console.log("Updating private issue fields…");

              await github.rest.issues.update({
                owner: "makegov",
                repo: "tango",
                issue_number: privateIssueNumber,
                title: `[Public] ${pub.title}`,
                body: `Mirrored from: ${pub.url}\n\n${pub.body}`
              });
            }

            if (event === "issues" && action === "closed") {
              console.log("Closing private issue…");

              await github.rest.issues.update({
                owner: "makegov",
                repo: "tango",
                issue_number: privateIssueNumber,
                state: "closed"
              });
            }

            if (event === "issues" && action === "reopened") {
              console.log("Reopening private issue…");

              await github.rest.issues.update({
                owner: "makegov",
                repo: "tango",
                issue_number: privateIssueNumber,
                state: "open"
              });
            }

            //
            // COMMENTS
            //
            if (event === "issue_comment" && action === "created") {
              const c = context.payload.comment;

              // Skip bot/self comments to avoid recursion
              if (c.user.type === "Bot") {
                console.log("Skipping bot comment…");
                return;
              }

              console.log("Mirroring public comment…");

              await github.rest.issues.createComment({
                owner: "makegov",
                repo: "tango",
                issue_number: privateIssueNumber,
                body: `Public comment by @${c.user.login}:\n\n${c.body}`
              });
            }
